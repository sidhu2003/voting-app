apiVersion: v1
kind: Service
metadata:
  name: vote-service
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: voting-app
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP now that the Ingress is the entry point. Nothing reaches this
  # from outside the cluster except through vote-ingress, which is the security
  # win as much as the tidiness one — one front door instead of a port open on
  # every node.
  type: ClusterIP

  selector:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting-app

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
