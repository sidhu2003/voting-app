apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: db-statefulset
  labels: 
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: voting-app
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: voting-app
  serviceName: db-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: voting-app
        app.kubernetes.io/managed-by: kustomize
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: db
        image: postgres:16.4
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1"
        ports:
        - containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        # The Postgres server reads USER / DB / PASSWORD on FIRST START to create
        # the database and role. It does NOT read POSTGRES_HOST or POSTGRES_PORT
        # — those exist for the clients that connect to it, and the server always
        # listens on 5432.
        #
        # Reading USER and DB from the same ConfigMap the clients use is the
        # point: the database is created with exactly the name and role that
        # worker and result will connect with, so they cannot drift apart.
        env:
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata

          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: voteapp-db-config
                key: POSTGRES_USER

          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: voteapp-db-config
                key: POSTGRES_DB

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: POSTGRES_PASSWORD

        # Without this, the Service starts sending traffic the moment the
        # container process exists — before Postgres accepts connections.
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
