apiVersion: apps/v1
kind: Deployment

metadata:
  name: result-deployment
  labels:
    app.kubernetes.io/name: result
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: voting-app
    app.kubernetes.io/managed-by: kustomize

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: result
      app.kubernetes.io/part-of: voting-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: result
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: voting-app
        app.kubernetes.io/managed-by: kustomize

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: result
              app.kubernetes.io/part-of: voting-app
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: result
          image: programmer175/voteapp_result:local
          # :local is built on this machine and never pushed anywhere.
          # IfNotPresent stops the kubelet trying to pull it from Docker Hub.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          # result reads ONLY from Postgres. It never touches Redis.
          envFrom:
            - configMapRef:
                name: voteapp-db-config
            - secretRef:
                name: db-secret

          # PORT stays inline rather than in a ConfigMap because it must agree
          # with containerPort above, and keeping them adjacent makes that visible.
          #
          # Do NOT copy docker-compose's PORT=80. This container runs as uid 10001
          # with `capabilities: drop: [ALL]`, which removes NET_BIND_SERVICE, so it
          # cannot bind any port below 1024. Compose gets away with 80 because
          # Docker keeps that capability by default. The Service maps 80 -> 4000.
          env:
            - name: PORT
              value: "4000"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: empty-volume
              mountPath: /tmp

      volumes:
        - name: empty-volume
          emptyDir: {}
