apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# DEV — the environment that actually runs on the local cluster.
#
#   kubectl apply -k kubernetes/overlays/dev
# ---------------------------------------------------------------------------

resources:
- ../../base

# Sets metadata.namespace on every resource AND renames the Namespace object
# itself, so one base produces three isolated environments.
namespace: voting-dev

labels:
- pairs:
    app.kubernetes.io/instance: voting-dev
    environment: dev

  # vote is a Rollout (a CRD), and kustomize has no schema for it. A strategic
  # merge patch therefore REPLACES the containers list instead of merging by
  # name -- silently producing a container with no image, no envFrom and no
  # probes. JSON6902 addresses exact paths, so it cannot do that.
patches:
- path: patches/scale.yaml
- path: patches/resources.yaml
- path: patches/ingress.yaml
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 50m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 192Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 384Mi
    - op: remove
      path: /spec/template/spec/containers/0/resources/limits/cpu
  target:
    group: argoproj.io
    kind: Rollout
    name: vote-deployment
    version: v1alpha1

# Locally built images that were never pushed anywhere.
