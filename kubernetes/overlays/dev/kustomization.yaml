- digest: sha256:ba0fe0cbe8d4db574abe4ba17c81736e726fd46998f0fdcffec5bf2e00b97c5c
  name: programmer175/voteapp_vote
  newName: 825979909451.dkr.ecr.ap-south-1.amazonaws.com/voteapp-vote
