apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# STAGE — production-shaped, dev-priced.
#
# The point of stage is to catch what dev cannot: a real rolling update across
# more than one worker replica, real ingress hostnames, real access patterns.
# It is NOT a capacity rehearsal, so the instance sizes stay small.
# ---------------------------------------------------------------------------

resources:
  - ../../base

namespace: voting-stage

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: voting-stage
      environment: stage

patches:
  - path: patches/scale.yaml
  - path: patches/resources.yaml
  - path: patches/ingress.yaml
  # vote is a Rollout (a CRD), and kustomize has no schema for it. A strategic
  # merge patch therefore REPLACES the containers list instead of merging by
  # name -- silently producing a container with no image, no envFrom and no
  # probes. JSON6902 addresses exact paths, so it cannot do that.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: vote-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 192Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu

images:
  - name: programmer175/voteapp_vote
    newTag: local
  - name: programmer175/voteapp_result
    newTag: local
  - name: programmer175/voteapp_worker
    newTag: local
